apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-provision
  namespace: {{ .Values.db.adminSecretNamespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade  # This job will run before the chart is installed or upgraded automatically. This is useful for provisioning the database before the application is deployed.
    # no need to have another trigger, this willl run before the chart is installed or upgraded automatically. This is useful for provisioning the database before the application is deployed.   
    helm.sh/hook-weight: "-5"  # priority of execution if more than one hook
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3  # retries before the Job is marked failed (default is 6)
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: provision
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.adminSecretName }}
                  key: postgres-password
            - name: TENANT_PASSWORD
              value: {{ .Values.dbPassword | quote }}
          command: ["sh", "-c"]
          args:
            - |
              psql -v ON_ERROR_STOP=1 -h {{ .Values.db.host }} -U postgres -d {{ .Values.db.name }} <<SQL
              CREATE SCHEMA IF NOT EXISTS "{{ .Values.tenantName }}";
              DO \$\$ BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.tenantName }}_app') THEN
                  CREATE USER "{{ .Values.tenantName }}_app" WITH PASSWORD '${TENANT_PASSWORD}';
                ELSE
                  ALTER USER "{{ .Values.tenantName }}_app" WITH PASSWORD '${TENANT_PASSWORD}';
                END IF;
              END \$\$;
              GRANT ALL ON SCHEMA "{{ .Values.tenantName }}" TO "{{ .Values.tenantName }}_app";
              ALTER ROLE "{{ .Values.tenantName }}_app" SET search_path TO "{{ .Values.tenantName }}";
              SQL
