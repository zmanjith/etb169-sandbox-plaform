name: Validate Tenant Request
on:

    #validate the changes and pushed to the add-tenant branch, which is development branch
    push:
        branches:
            - add-tenant
        paths:
            - "app/demo-sandbox-chart/**"
            - "app/tenants/**"
    #validate the whole changes when a pull request is created to the add-tenant branch, which is development branch
    #integrating the to the main branch.
    pull_request:
        branches:
            - add-tenant
        paths:
            - "app/demo-sandbox-chart/**"
            - "app/tenants/**"
jobs:
    validate:
        name: Validate Helm Chart and Tenant Values
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Gileaks secret scan
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Checkov IaC scan (Helm Chart)
              uses: bridgecrewio/checkov-action@master
              with:
                  directory: app/demo-sandbox-chart
                  framework: helm
                  helm-values: app/demo-sandbox-chart/values.yaml
                  skip_check: CKV_K8S_21, CKV_K8S_15, CKV_K8S_29, CKV_K8S_38, CKV_K8S_48, CKV_K8S_35, CKV_K8S_43
